<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 캘린더 가계부</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">📅 캘린더 가계부 로그인</h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">아이디</label>
                <input type="text" id="username" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="아이디를 입력하세요">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">비밀번호</label>
                <input type="password" id="password" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="비밀번호를 입력하세요">
            </div>
            <button id="loginBtn" class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition font-medium">로그인</button>
            <button id="signupBtn" class="w-full bg-gray-200 text-gray-700 py-2 rounded-lg hover:bg-gray-300 transition font-medium">회원가입</button>
        </div>
    </div>

    <!-- Firebase 연결 및 기능 작동 코드 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB_Z6XPbIEQe73FNgC1PmiDjMM-FfEkESQ",
            authDomain: "mgdb-b21ff.firebaseapp.com",
            projectId: "mgdb-b21ff",
            storageBucket: "mgdb-b21ff.firebasestorage.app",
            messagingSenderId: "206404405257",
            appId: "1:206404405257:web:c30800f894773eb237d0d8"
        };

        // Firebase 시작
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 회원가입 버튼을 눌렀을 때
        document.getElementById('signupBtn').addEventListener('click', async () => {
            const rawId = document.getElementById('username').value.trim();
            const rawPassword = document.getElementById('password').value;

            if (!rawId || !rawPassword) {
                alert('아이디와 비밀번호를 입력해주세요!');
                return;
            }

            const email = rawId + '@mg.com';
            const password = rawPassword.length < 6 ? rawPassword + 'mgpass' : rawPassword;

            try {
                await createUserWithEmailAndPassword(auth, email, password);

                // 데이터베이스에 유저 이름(rawId)을 문서 ID로 하여 빈 거래내역 구조 생성
                await setDoc(doc(db, "users", rawId), {
                    username: rawId,
                    거래내역: {}
                });

                alert('회원가입이 완료되었습니다!');
                location.href = 'main.html';
            } catch (error) {
                alert('회원가입 실패: ' + error.message);
            }
        });

        // 로그인 버튼을 눌렀을 때
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const rawId = document.getElementById('username').value.trim();
            const rawPassword = document.getElementById('password').value;

            if (!rawId || !rawPassword) {
                alert('아이디와 비밀번호를 입력해주세요!');
                return;
            }

            const email = rawId + '@mg.com';
            const password = rawPassword.length < 6 ? rawPassword + 'mgpass' : rawPassword;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert('로그인 성공!');
                location.href = 'main.html';
            } catch (error) {
                alert('로그인 실패: 아이디나 비밀번호를 확인해주세요.');
            }
        });
    </script>
</body>
</html>
