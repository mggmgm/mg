<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캘린더 수입/지출 가계부 & 메모</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
<!-- 👇 이 부분을 추가해주세요! -->
    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="icon" type="image/png" href="./icon.png">
    <style>
        /* CSS로도 1차 숨김 처리 */
        iframe[src*="netlify"], #netlify-badge, .netlify-badge {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-2 sm:p-6 flex flex-col items-center">

<!-- 상단 헤더 -->
    <div class="w-full max-w-6xl bg-white p-4 sm:p-5 rounded-lg shadow-md mb-4 sm:mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
        <div>
            <h1 class="text-lg sm:text-2xl font-bold text-gray-800">📅 캘린더 가계부 & 대시보드</h1>
            <p id="userWelcome" class="text-xs sm:text-sm text-gray-600 mt-0.5">사용자 정보를 불러오는 중...</p>
        </div>
        
        <!-- 우측 버튼 및 로그인 유지 시간 영역 (로그인/회원탈퇴 크기는 유지하되 타이머/연장만 모바일 밀착 최적화) -->
        <div class="flex flex-wrap items-center justify-end gap-1.5 sm:gap-2 w-full md:w-auto">
            <!-- 로그인 유지 남은 시간 -->
            <div class="bg-blue-50 px-2 sm:px-3 py-1.5 rounded-lg border border-blue-100 flex items-center space-x-1">
                <span class="text-[11px] sm:text-xs text-blue-600 font-medium">⏱️:</span>
                <span id="timerDisplay" class="text-xs sm:text-sm font-extrabold text-blue-700">00:00:00</span>
            </div>

            <!-- 시간 연장 버튼 -->
            <button id="extendBtn" class="bg-indigo-500 text-white px-2.5 sm:px-4 py-1.5 sm:py-2 rounded-lg hover:bg-indigo-600 transition font-medium text-xs sm:text-sm shadow">
                시간 연장 (+1시간)
            </button>

            <!-- 기존 로그아웃 & 회원탈퇴 버튼 (크기 유지) -->
            <button id="logoutBtn" class="bg-gray-200 text-gray-700 px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg hover:bg-gray-300 transition text-xs sm:text-sm font-medium">로그아웃</button>
            <button id="withdrawBtn" class="bg-red-100 text-red-600 px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg hover:bg-red-200 transition text-xs sm:text-sm font-medium">회원탈퇴</button>
        </div>
    </div>

    <!-- 메인 콘텐츠 레이아웃 (좌측: 캘린더 및 요약/리스트, 우측: 메모) -->
    <div class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-3 gap-4 sm:gap-6 mb-6">
        
        <!-- 1번 영역: 캘린더, 요약 통계 및 토스 스타일 월별 내역 (2칸 차지) -->
        <div class="lg:col-span-2 bg-white p-3 sm:p-6 rounded-lg shadow-md flex flex-col justify-between">
            <div>
                <!-- 달력 상단 컨트롤 (월 이동) -->
                <div class="flex justify-between items-center mb-4 sm:mb-6 px-1">
                    <button id="prevMonthBtn" class="bg-gray-100 hover:bg-gray-200 px-2.5 py-1.5 rounded-lg text-xs sm:text-sm font-bold text-gray-700 transition">◀ 이전 달</button>
                    <h2 id="calendarTitle" class="text-lg sm:text-xl font-extrabold text-gray-800">2026년 11월</h2>
                    <button id="nextMonthBtn" class="bg-gray-100 hover:bg-gray-200 px-2.5 py-1.5 rounded-lg text-xs sm:text-sm font-bold text-gray-700 transition">다음 달 ▶</button>
                </div>

                <!-- 요일 헤더 -->
                <div class="grid grid-cols-7 gap-0.5 sm:gap-1 text-center font-bold text-gray-500 text-xs sm:text-sm mb-2">
                    <div class="text-red-500">일</div>
                    <div>월</div>
                    <div>화</div>
                    <div>수</div>
                    <div>목</div>
                    <div>금</div>
                    <div class="text-blue-500">토</div>
                </div>

                <!-- 달력 날짜 그리드 -->
                <div id="calendarGrid" class="grid grid-cols-7 gap-1 mb-4 sm:mb-6">
                    <!-- 자바스크립트로 동적 생성됨 -->
                </div>
            </div>

            <!-- 이번달 요약 통계 카드 (4분할) -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2 sm:gap-3 pt-3 sm:pt-4 border-t">
                <div class="bg-blue-50 p-2.5 sm:p-3 rounded-xl text-center shadow-sm">
                    <span class="text-[11px] sm:text-xs text-blue-600 font-medium">이번달 총 수입</span>
                    <div id="summaryIncome" class="text-xs sm:text-sm font-extrabold text-blue-700 mt-1">0 원</div>
                </div>
                <div class="bg-red-50 p-2.5 sm:p-3 rounded-xl text-center shadow-sm">
                    <span class="text-[11px] sm:text-xs text-red-600 font-medium">이번달 총 지출</span>
                    <div id="summaryExpense" class="text-xs sm:text-sm font-extrabold text-red-700 mt-1">0 원</div>
                </div>
                <div class="bg-orange-50 p-2.5 sm:p-3 rounded-xl text-center shadow-sm">
                    <span id="summaryPlannedLabel" class="text-[11px] sm:text-xs text-orange-600 font-medium">예상 지출 총액</span>
                    <div id="summaryPlanned" class="text-xs sm:text-sm font-extrabold text-orange-700 mt-1">0 원</div>
                </div>
                <div class="bg-indigo-50 p-2.5 sm:p-3 rounded-xl text-center shadow-sm">
                    <span class="text-[11px] sm:text-xs text-indigo-600 font-medium">순수입 (수입-지출)</span>
                    <div id="summaryNet" class="text-xs sm:text-sm font-extrabold text-indigo-700 mt-1">0 원</div>
                </div>
            </div>

            <!-- 토스 스타일 이번 달 전체 내역 리스트 -->
            <div class="mt-6 pt-4 border-t">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-sm font-bold text-gray-800 flex items-center">📋 이번 달 거래 내역 모아보기</h3>
                    <span id="monthlyItemCount" class="text-xs text-gray-500 font-medium">총 0건</span>
                </div>
                <div id="monthlyTransactionFeed" class="space-y-2 max-h-[320px] overflow-y-auto pr-1">
                    <p class="text-xs text-gray-400 text-center py-4">이번 달 등록된 내역이 없습니다.</p>
                </div>
            </div>
        </div>

        <!-- 2번 영역: 메모 (1칸 차지) -->
        <div class="bg-white p-4 sm:p-6 rounded-lg shadow-md flex flex-col justify-between">
            <div class="flex flex-col h-full">
                <h2 class="text-base sm:text-lg font-bold text-gray-800 mb-3 sm:mb-4 flex items-center">📝 메모</h2>
                
                <div class="mb-3">
                    <textarea id="memoInput" placeholder="기록할 내용을 입력하세요..." class="w-full border rounded-lg p-2 text-sm focus:outline-blue-500 resize-none h-24"></textarea>
                    <button id="addMemoBtn" class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition font-medium text-sm shadow mt-1">
                        메모 등록
                    </button>
                </div>

                <div id="memoList" class="space-y-2 overflow-y-auto max-h-[350px] pr-1 flex-grow border-t pt-2">
                    <p class="text-xs text-gray-400 text-center py-4">저장된 메모가 없습니다.</p>
                </div>
            </div>
        </div>

    </div>

    <!-- 날짜별 상세 내역 모달 (팝업창) -->
    <div id="dayModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white w-full max-w-md p-5 sm:p-6 rounded-2xl shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 id="modalDateTitle" class="text-base sm:text-lg font-bold text-gray-800">2026년 11월 1일 내역</h3>
                <button id="closeModalBtn" class="text-gray-400 hover:text-gray-600 font-bold text-lg px-2">✕</button>
            </div>

            <!-- 항목 추가 입력폼 -->
            <div class="bg-gray-50 p-3 rounded-xl mb-4 border space-y-2">
                <div class="flex space-x-2">
                    <select id="modalCategory" class="border rounded-lg px-2 py-1.5 text-sm bg-white font-medium focus:outline-blue-500">
                        <option value="수입">수입 (+)</option>
                        <option value="기름값">기름값 (-)</option>
                        <option value="밥값">밥값 (-)</option>
                        <option value="담배값">담배값 (-)</option>
                        <option value="기타 지출">기타 지출 (-)</option>
                        <option value="예정 지출">예정 지출 (-)</option>
                    </select>
                    <input type="text" id="modalAmount" placeholder="금액 입력" class="flex-grow border rounded-lg px-3 py-1.5 text-sm text-right focus:outline-blue-500">
                </div>
                <div>
                    <input type="text" id="modalReason" placeholder="기타 사유 입력 (예: 오토바이 수리)" class="w-full border rounded-lg px-3 py-1.5 text-sm focus:outline-blue-500 bg-white">
                </div>
                <button id="addTransactionBtn" class="w-full bg-indigo-500 text-white py-2 rounded-lg hover:bg-indigo-600 transition font-medium text-sm shadow">
                    내역 추가하기
                </button>
            </div>

            <!-- 해당 일자 내역 리스트 -->
            <div class="overflow-y-auto flex-grow space-y-2 pr-1 max-h-60" id="modalTransactionList">
                <p class="text-xs text-gray-400 text-center py-4">등록된 내역이 없습니다.</p>
            </div>

            <!-- 일자별 합계 -->
            <div class="mt-4 pt-3 border-t flex justify-between items-center font-bold">
                <span class="text-sm text-gray-600">이 날의 정산 합계</span>
                <span id="modalDayTotal" class="text-base text-indigo-600">0 원</span>
            </div>
        </div>
    </div>

    <!-- Firebase 및 로직 스크립트 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, deleteUser } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 넷리파이 배지 강제 삭제 실행 스크립트
        window.addEventListener('DOMContentLoaded', () => {
            const removeBadge = () => {
                document.querySelectorAll('iframe, div, a').forEach(el => {
                    if ((el.src && el.src.includes('netlify')) || 
                        (el.id && el.id.includes('netlify')) || 
                        (el.className && typeof el.className === 'string' && el.className.includes('netlify')) ||
                        (el.innerText && el.innerText.includes('Powered by Netlify'))) {
                        el.remove();
                    }
                });
            };
            removeBadge();
            setTimeout(removeBadge, 300);
            setTimeout(removeBadge, 1000);
        });

        const firebaseConfig = {
            apiKey: "AIzaSyB_Z6XPbIEQe73FNgC1PmiDjMM-FfEkESQ",
            authDomain: "mgdb-b21ff.firebaseapp.com",
            projectId: "mgdb-b21ff",
            storageBucket: "mgdb-b21ff.firebasestorage.app",
            messagingSenderId: "206404405257",
            appId: "1:206404405257:web:c30800f894773eb237d0d8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let currentUsername = "";
        let currentDate = new Date(2026, 10, 1); // 기본 2026년 11월
        let selectedDateStr = "";
        let userData = { 거래내역: {}, 메모: [] };

        // 금액 입력 시 자동 콤마 및 마이너스 포맷팅
        const modalAmountInput = document.getElementById('modalAmount');
        modalAmountInput.addEventListener('input', (e) => {
            let val = e.target.value;
            let hasMinus = val.startsWith('-');
            let numbers = val.replace(/[^0-9]/g, '');
            if (val === '-' || (hasMinus && numbers === '')) {
                e.target.value = '-';
            } else if (numbers === '') {
                e.target.value = '';
            } else {
                e.target.value = (hasMinus ? '-' : '') + Number(numbers).toLocaleString();
            }
        });

        // 1. 로그인 상태 확인 및 데이터 불러오기
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                currentUsername = user.email ? user.email.split('@')[0] : 'user';
                
                await loadUserDataAndRender();
            } else {
                alert('로그인이 필요합니다.');
                location.href = 'index.html';
            }
        });

        // 월 이동 버튼 이벤트
        document.getElementById('prevMonthBtn').addEventListener('click', async () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendarAndSummary();
        });

        document.getElementById('nextMonthBtn').addEventListener('click', async () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendarAndSummary();
        });

        // 유저 데이터 불러오기
        async function loadUserDataAndRender() {
            try {
                const userDocRef = doc(db, "users", currentUsername);
                const userDoc = await getDoc(userDocRef);

                if (userDoc.exists()) {
                    userData = userDoc.data();
                    if (!userData.거래내역) userData.거래내역 = {};
                    if (!userData.메모) userData.메모 = [];
                } else {
                    userData = { 거래내역: {}, 메모: [] };
                    await setDoc(userDocRef, userData, { merge: true });
                }

                document.getElementById('userWelcome').innerText = `${currentUsername}님 환영합니다!`;
            } catch (error) {
                console.error("데이터 로드 실패:", error);
                userData = { 거래내역: {}, 메모: [] };
                document.getElementById('userWelcome').innerText = `${currentUsername}님 환영합니다!`;
            }

            renderCalendarAndSummary();
            renderMemos();
        }

        // 달력 및 요약 통계 렌더링
        function renderCalendarAndSummary() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth(); // 0~11
            document.getElementById('calendarTitle').innerText = `${year}년 ${month + 1}월`;

            const monthlyData = {};
            let totalIncome = 0;
            let totalExpense = 0;
            let totalPlanned = 0;

            const transactionsMap = userData.거래내역 || {};

            for (const [dateStr, items] of Object.entries(transactionsMap)) {
                if (dateStr.startsWith(`${year}-${String(month + 1).padStart(2, '0')}`)) {
                    let actualSum = 0;
                    let plannedSum = 0;

                    items.forEach(t => {
                        let cleanNum = String(t.금액).replace(/,/g, '');
                        let amount = Number(cleanNum) || 0;

                        if (t.분류 === '수입') {
                            actualSum += amount;
                            totalIncome += amount;
                        } else if (t.분류 === '예정 지출') {
                            plannedSum += amount;
                            totalPlanned += amount;
                        } else {
                            actualSum -= Math.abs(amount);
                            totalExpense += Math.abs(amount);
                        }
                    });

                    monthlyData[dateStr] = { actualSum, plannedSum };
                }
            }

            document.getElementById('summaryIncome').innerText = totalIncome.toLocaleString() + ' 원';
            document.getElementById('summaryExpense').innerText = totalExpense.toLocaleString() + ' 원';
            
            document.getElementById('summaryPlannedLabel').innerText = `${month + 1}월 예상 지출 총액`;
            document.getElementById('summaryPlanned').innerText = totalPlanned.toLocaleString() + ' 원';

            const net = totalIncome - totalExpense;
            const netEl = document.getElementById('summaryNet');
            netEl.innerText = net.toLocaleString() + ' 원';
            netEl.className = net < 0 ? "text-xs sm:text-sm font-extrabold text-red-600 mt-1" : "text-xs sm:text-sm font-extrabold text-indigo-700 mt-1";

            renderCalendarGrid(year, month, monthlyData);
            renderMonthlyTransactionFeed(year, month);
        }

        // 달력 그리드 생성 함수 (모바일 한 줄 정렬 최적화)
        function renderCalendarGrid(year, month, monthlyData) {
            const gridEl = document.getElementById('calendarGrid');
            gridEl.innerHTML = '';

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = "bg-gray-50 rounded-xl min-h-[65px] sm:min-h-[90px] opacity-40";
                gridEl.appendChild(emptyCell);
            }

            for (let day = 1; day <= lastDay; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayData = monthlyData[dateStr] || { actualSum: 0, plannedSum: 0 };
                const hasData = userData.거래내역 && userData.거래내역[dateStr] && userData.거래내역[dateStr].length > 0;

                const cell = document.createElement('div');
                cell.className = "bg-gray-50 hover:bg-blue-50 border border-gray-200 rounded-md sm:rounded-xl p-0.5 sm:p-2 min-h-[65px] sm:min-h-[90px] flex flex-col justify-between cursor-pointer transition shadow-sm overflow-hidden";
                
                let actualHtml = `<span class="text-[8px] sm:text-xs text-gray-300">-</span>`;
                if (hasData) {
                    const colorClass = dayData.actualSum < 0 ? "text-red-600 font-bold" : "text-blue-600 font-bold";
                    actualHtml = `<span class="text-[5.5px] sm:text-xs ${colorClass} leading-tight block whitespace-nowrap tracking-tighter">${dayData.actualSum.toLocaleString()}원</span>`;
                }

                let plannedHtml = '';
                if (dayData.plannedSum > 0) {
                    plannedHtml = `<div class="text-right"><span class="text-[5.5px] sm:text-[10px] bg-orange-100 text-orange-700 font-bold px-0.5 rounded leading-tight inline-block whitespace-nowrap tracking-tighter">예정:-${dayData.plannedSum.toLocaleString()}원</span></div>`;
                }

                cell.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="text-[11px] sm:text-sm font-bold text-gray-700">${day}</span>
                    </div>
                    <div class="flex flex-col mt-auto space-y-0.5">
                        ${plannedHtml}
                        <div class="text-right">${actualHtml}</div>
                    </div>
                `;

                cell.addEventListener('click', () => openDayModal(dateStr, `${year}년 ${month + 1}월 ${day}일`));
                gridEl.appendChild(cell);
            }
        }

        // 토스 스타일 이번 달 전체 내역 리스트 렌더링 함수
        function renderMonthlyTransactionFeed(year, month) {
            const feedEl = document.getElementById('monthlyTransactionFeed');
            const countEl = document.getElementById('monthlyItemCount');
            feedEl.innerHTML = '';

            const prefix = `${year}-${String(month + 1).padStart(2, '0')}`;
            const transactionsMap = userData.거래내역 || {};
            
            const matchedDates = Object.keys(transactionsMap)
                .filter(dateStr => dateStr.startsWith(prefix))
                .sort((a, b) => b.localeCompare(a));

            let allItems = [];
            matchedDates.forEach(dateStr => {
                const items = transactionsMap[dateStr];
                items.forEach((t, idx) => {
                    allItems.push({ dateStr, ...t, originalIndex: idx });
                });
            });

            countEl.innerText = `총 ${allItems.length}건`;

            if (allItems.length === 0) {
                feedEl.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">이번 달 등록된 내역이 없습니다.</p>';
                return;
            }

            allItems.forEach(item => {
                let cleanNum = String(item.금액).replace(/,/g, '');
                let amount = Number(cleanNum) || 0;
                let isIncome = item.분류 === '수입';
                let isPlanned = item.분류 === '예정 지출';

                let badgeColor = "bg-red-100 text-red-700";
                let amountColor = "text-red-600 font-bold";
                if (isIncome) {
                    badgeColor = "bg-blue-100 text-blue-700";
                    amountColor = "text-blue-600 font-bold";
                } else if (isPlanned) {
                    badgeColor = "bg-orange-100 text-orange-700";
                    amountColor = "text-orange-600 font-bold";
                }

                const reasonText = item.기타사유 ? `<span class="text-xs text-gray-500 ml-1.5">(${item.기타사유})</span>` : '';

                const row = document.createElement('div');
                row.className = "bg-gray-50 hover:bg-blue-50/50 p-2.5 rounded-xl border flex justify-between items-center text-sm transition shadow-sm cursor-pointer";
                row.innerHTML = `
                    <div class="flex items-center space-x-2.5 overflow-hidden">
                        <span class="text-[11px] text-gray-500 font-medium whitespace-nowrap">${item.dateStr.slice(5)}</span>
                        <span class="text-xs px-2 py-0.5 rounded-full font-bold ${badgeColor} whitespace-nowrap">${item.분류}</span>
                        <div class="truncate">
                            <span class="${amountColor} text-sm">${isPlanned ? '-' : ''}${Math.abs(amount).toLocaleString()} 원</span>
                            ${reasonText}
                        </div>
                    </div>
                    <button onclick="openDayModalFromFeed('${item.dateStr}')" class="text-xs text-blue-500 font-medium hover:underline whitespace-nowrap ml-2">상세보기</button>
                `;
                feedEl.appendChild(row);
            });
        }

        window.openDayModalFromFeed = function(dateStr) {
            const parts = dateStr.split('-');
            openDayModal(dateStr, `${parts[0]}년 ${Number(parts[1])}월 ${Number(parts[2])}일`);
        };

        // 모달 열기
        async function openDayModal(dateStr, titleStr) {
            selectedDateStr = dateStr;
            document.getElementById('modalDateTitle').innerText = titleStr + " 내역";
            document.getElementById('modalAmount').value = '';
            document.getElementById('modalReason').value = '';
            document.getElementById('dayModal').classList.remove('hidden');
            renderDayTransactions();
        }

        document.getElementById('closeModalBtn').addEventListener('click', () => {
            document.getElementById('dayModal').classList.add('hidden');
            renderCalendarAndSummary();
        });

        // 해당 날짜 거래 내역 렌더링
        function renderDayTransactions() {
            const listEl = document.getElementById('modalTransactionList');
            listEl.innerHTML = '';

            if (!userData.거래내역) userData.거래내역 = {};
            const dayItems = userData.거래내역[selectedDateStr] || [];

            if (dayItems.length === 0) {
                listEl.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">등록된 내역이 없습니다.</p>';
                document.getElementById('modalDayTotal').innerText = '0 원';
                document.getElementById('modalDayTotal').className = "text-base font-extrabold text-indigo-600";
                return;
            }

            let dayTotal = 0;
            dayItems.forEach((t, index) => {
                let cleanNum = String(t.금액).replace(/,/g, '');
                let amount = Number(cleanNum) || 0;
                let isIncome = t.분류 === '수입';
                let isPlanned = t.분류 === '예정 지출';

                let calcAmount = isIncome ? amount : -Math.abs(amount);
                if (!isPlanned) {
                    dayTotal += calcAmount;
                }

                let badgeColor = "bg-red-100 text-red-700";
                let amountColor = "text-red-600 font-bold";
                if (isIncome) {
                    badgeColor = "bg-blue-100 text-blue-700";
                    amountColor = "text-blue-600 font-bold";
                } else if (isPlanned) {
                    badgeColor = "bg-orange-100 text-orange-700";
                    amountColor = "text-orange-600 font-bold";
                }

                const reasonText = t.기타사유 ? `<span class="text-xs text-gray-500 ml-2">(${t.기타사유})</span>` : '';

                const item = document.createElement('div');
                item.className = "bg-white p-3 rounded-xl border flex justify-between items-center text-sm shadow-sm";
                item.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <span class="text-xs px-2 py-0.5 rounded-full font-bold ${badgeColor}">${t.분류}</span>
                        <span class="${amountColor}">${isPlanned ? '-' : ''}${Math.abs(amount).toLocaleString()} 원</span>
                        ${reasonText}
                    </div>
                    <button onclick="deleteTransaction(${index})" class="text-gray-400 hover:text-red-600 font-bold text-xs px-1">✕</button>
                `;
                listEl.appendChild(item);
            });

            const totalEl = document.getElementById('modalDayTotal');
            totalEl.innerText = dayTotal.toLocaleString() + ' 원';
            totalEl.className = dayTotal < 0 ? "text-base font-extrabold text-red-600" : "text-base font-extrabold text-indigo-600";
        }

        // 거래 내역 추가 버튼
        document.getElementById('addTransactionBtn').addEventListener('click', async () => {
            const category = document.getElementById('modalCategory').value;
            const rawAmount = document.getElementById('modalAmount').value.replace(/,/g, '');
            const amount = Number(rawAmount);
            const reason = document.getElementById('modalReason').value.trim();

            if (!amount || isNaN(amount)) {
                alert('올바른 금액을 입력해주세요.');
                return;
            }

            if (!userData.거래내역) userData.거래내역 = {};
            if (!userData.거래내역[selectedDateStr]) {
                userData.거래내역[selectedDateStr] = [];
            }

            const formattedAmountStr = Math.abs(amount).toLocaleString();

            userData.거래내역[selectedDateStr].push({
                분류: category,
                금액: formattedAmountStr,
                기타사유: reason
            });

            try {
                const userDocRef = doc(db, "users", currentUsername);
                await setDoc(userDocRef, { 거래내역: userData.거래내역 }, { merge: true });
                
                document.getElementById('modalAmount').value = '';
                document.getElementById('modalReason').value = '';
                renderDayTransactions();
            } catch (error) {
                alert('등록 실패: ' + error.message);
            }
        });

        // 거래 내역 삭제 함수
        window.deleteTransaction = async function(index) {
            if (confirm('이 내역을 삭제하시겠습니까?')) {
                try {
                    userData.거래내역[selectedDateStr].splice(index, 1);
                    if (userData.거래내역[selectedDateStr].length === 0) {
                        delete userData.거래내역[selectedDateStr];
                    }

                    const userDocRef = doc(db, "users", currentUsername);
                    await setDoc(userDocRef, { 
                        거래내역: userData.거래내역 
                    }, { merge: false });
                    
                    renderDayTransactions();
                    renderCalendarAndSummary();
                } catch (error) {
                    alert('삭제 실패: ' + error.message);
                }
            }
        };

        // 3. 메모 기능 (한글 필드 동기화 방식)
        function renderMemos() {
            const memoListEl = document.getElementById('memoList');
            memoListEl.innerHTML = '';

            if (!userData.메모) userData.메모 = [];

            if (userData.메모.length === 0) {
                memoListEl.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">저장된 메모가 없습니다.</p>';
                return;
            }

            // 최신순으로 보여주기 위해 역순 출력
            userData.메모.forEach((memoText, index) => {
                const item = document.createElement('div');
                item.className = "bg-gray-50 p-2.5 rounded-xl border flex justify-between items-start text-sm shadow-sm";
                item.innerHTML = `
                    <span class="text-gray-700 whitespace-pre-wrap break-all pr-2">${escapeHtml(memoText)}</span>
                    <button onclick="deleteMemo(${index})" class="text-red-400 hover:text-red-600 text-xs font-bold px-1">✕</button>
                `;
                memoListEl.appendChild(item);
            });
        }

        document.getElementById('addMemoBtn').addEventListener('click', async () => {
            const text = document.getElementById('memoInput').value.trim();
            if (!text) {
                alert('메모 내용을 입력해주세요.');
                return;
            }

            if (!userData.메모) userData.메모 = [];
            userData.메모.unshift(text); // 최신 메모가 위로 오도록 추가

            try {
                const userDocRef = doc(db, "users", currentUsername);
                await setDoc(userDocRef, { 메모: userData.메모 }, { merge: true });

                document.getElementById('memoInput').value = '';
                renderMemos();
            } catch (error) {
                alert('메모 등록 실패: ' + error.message);
            }
        });

        window.deleteMemo = async function(index) {
            if (confirm('이 메모를 삭제하시겠습니까?')) {
                try {
                    userData.메모.splice(index, 1);

                    const userDocRef = doc(db, "users", currentUsername);
                    await setDoc(userDocRef, { 메모: userData.메모 }, { merge: false });

                    renderMemos();
                } catch (error) {
                    alert('메모 삭제 실패: ' + error.message);
                }
            }
        };

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // 4. 타이머 구동 및 남은 시간 카운트다운 로직
        let expireTime = localStorage.getItem('loginExpireTime');

        if (!expireTime) {
            expireTime = Date.now() + (1 * 60 * 60 * 1000); // 기본 1시간
            localStorage.setItem('loginExpireTime', expireTime);
        }

        const timerInterval = setInterval(() => {
            const now = Date.now();
            const timeLeft = expireTime - now;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                localStorage.removeItem('loginExpireTime');
                alert('로그인 유지 시간이 만료되었습니다. 다시 로그인해주세요.');
                
                signOut(auth).then(() => {
                    window.location.href = './index.html';
                }).catch(() => {
                    window.location.href = './index.html';
                });
            } else {
                const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

                document.getElementById('timerDisplay').innerText = 
                    `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }
        }, 1000);

        // 시간 연장 버튼 (+1시간)
        document.getElementById('extendBtn').addEventListener('click', () => {
            const extension = 1 * 60 * 60 * 1000;
            const currentExpire = Number(localStorage.getItem('loginExpireTime')) || Date.now();
            expireTime = Math.max(Date.now(), currentExpire) + extension;
            
            localStorage.setItem('loginExpireTime', expireTime);
            alert('로그인 시간이 1시간 연장되었습니다!');
        });

        // 5. 로그아웃 & 회원탈퇴
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                localStorage.removeItem('loginExpireTime');
                await signOut(auth);
                alert('로그아웃 되었습니다.');
                location.href = 'index.html';
            } catch (error) {
                alert('로그아웃 실패: ' + error.message);
            }
        });

        document.getElementById('withdrawBtn').addEventListener('click', async () => {
            if (confirm('정말 회원탈퇴 하시겠습니까? 데이터와 계정이 영구적으로 삭제됩니다.')) {
                try {
                    await deleteDoc(doc(db, "users", currentUsername));
                    await deleteUser(currentUser);
                    alert('회원탈퇴가 완료되었습니다.');
                    location.href = 'index.html';
                } catch (error) {
                    alert('회원탈퇴 실패: ' + error.message);
                }
            }
        });
    </script>
</body>
</html>
